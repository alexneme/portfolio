comments:
  allowedFields: ["name", "comment"]
  branch: "main"
  commitMessage: "New comment by {fields.name}"
  filename: "comment-{@timestamp}"
  format: "yaml"
  generatedFields:
    date:
      type: date
      options:
        format: iso8601
  moderation: false
  path: "data/comments/{options.slug}"
  requiredFields: ["name", "comment"]
  transforms:
    name: "trim"
    comment: "trim"
