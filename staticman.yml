comments:
  path: "data/comments/{options.slug}"
  format: "json"
  filename: "{@timestamp}"
  extension: "json"
  moderation: true
  generatedFields:
    date:
      type: date
      options:
        format: iso8601
  allowedFields: ["name", "comment"] 
  requiredFields: ["name", "comment"]
  transforms:
    comment: "md"
