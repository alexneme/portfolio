# ---- http-level (conf.d is included under http {}) ----
server_tokens off;

# Gzip & small hygiene
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain text/css application/javascript application/json application/xml
  image/svg+xml application/rss+xml font/ttf font/otf application/vnd.ms-fontobject
  application/x-font-ttf application/x-font-opentype;
etag on;

# ----------------- HTTP -> HTTPS + ACME -----------------
server {
  listen 80;
  listen [::]:80;
  server_name neme.site www.neme.site blog.neme.site;

  # ACME challenge (HTTP)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  return 301 https://$host$request_uri;
}

# ----------------- Portfolio (SPA) -----------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name neme.site www.neme.site;

  # TLS (same cert covers blog if you include blog.neme.site in the cert)
  ssl_certificate     /etc/letsencrypt/live/neme.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/neme.site/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # OCSP stapling (optional; fine with Let's Encrypt)
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 5s;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self';" always;

  # Serve portfolio build
  root  /srv/website;
  index index.html;

  # ACME (HTTPS too)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Caching
  location ~* \.html$ { add_header Cache-Control "no-cache"; }
  location ~* \.(css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Vary "Accept-Encoding";
    try_files $uri =404;
    access_log off;
  }

  # Health
  location = /healthz { add_header Content-Type text/plain; return 200 'OK'; }
}

# ----------------- Blog (Hugo static) -----------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name blog.neme.site;

  ssl_certificate     /etc/letsencrypt/live/neme.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/neme.site/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 5s;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root  /srv/blog;
  index index.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  # Hugo: no SPA fallback; real 404 (Hugo provides 404.html)
  location / {
    try_files $uri $uri/ =404;
  }

  # Caching
  location ~* \.html$ { add_header Cache-Control "no-cache"; }
  location ~* \.(css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Vary "Accept-Encoding";
    try_files $uri =404;
    access_log off;
  }

  location = /healthz { add_header Content-Type text/plain; return 200 'OK'; }
}
